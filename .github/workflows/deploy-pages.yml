name: Deploy Story Daily to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build blog
        run: python scripts/build.py

      - name: Check links and feeds
        run: python scripts/validate.py

      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html posts.json feed.xml sitemap.xml robots.txt .nojekyll _site/
          cp -R assets posts galleries _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
