<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>거절하던 에이전트가 비밀을 흘리기 직전 · 이미지로 보기</title>
<style>
:root{color-scheme:light;--ink:#171717;--muted:#777;--line:#e8e5df;--accent:#d95f3f}
*{box-sizing:border-box}body{margin:0;background:#f7f5f1;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 18px;background:rgba(247,245,241,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
h1{margin:0;font-size:15px;line-height:1.35}a{color:inherit;text-underline-offset:3px}.counter{color:var(--muted);font-variant-numeric:tabular-nums}
main{min-height:calc(100vh - 58px);display:grid;place-items:start center;padding:20px 14px 64px}.shot{display:block;width:min(860px,100%);height:auto;background:#fff;box-shadow:0 18px 45px rgba(0,0,0,.08)}
.nav{position:fixed;top:58px;bottom:0;width:22%;border:0;background:transparent;cursor:pointer}.prev{left:0}.next{right:0}.nav:focus-visible{outline:3px solid var(--accent);outline-offset:-6px}
@media(max-width:700px){header{align-items:flex-start}h1{font-size:13px}.nav{width:28%}}
</style>
</head>
<body>
<header><h1>거절하던 에이전트가 비밀을 흘리기 직전</h1><div><a href="../posts/precrime-agents.html">글로 보기</a> · <span class="counter" id="counter"></span></div></header>
<main><img class="shot" id="shot" alt="논문 해설 카드"></main>
<button class="nav prev" id="prev" type="button" aria-label="이전 장"></button>
<button class="nav next" id="next" type="button" aria-label="다음 장"></button>
<script>
const shots=[
"../assets/posts/precrime-agents/card-01.webp","../assets/posts/precrime-agents/card-02.webp","../assets/posts/precrime-agents/card-03.webp","../assets/posts/precrime-agents/card-04.webp","../assets/posts/precrime-agents/card-05.webp","../assets/posts/precrime-agents/card-06.webp","../assets/posts/precrime-agents/card-07.webp","../assets/posts/precrime-agents/card-08.webp","../assets/posts/precrime-agents/card-09.webp","../assets/posts/precrime-agents/card-10.webp","../assets/posts/precrime-agents/card-11.webp","../assets/posts/precrime-agents/card-12.webp","../assets/posts/precrime-agents/card-13.webp","../assets/posts/precrime-agents/card-14.webp","../assets/posts/precrime-agents/card-15.webp","../assets/posts/precrime-agents/card-16.webp","../assets/posts/precrime-agents/card-17.webp","../assets/posts/precrime-agents/card-18.webp","../assets/posts/precrime-agents/card-19.webp","../assets/posts/precrime-agents/card-20.webp","../assets/posts/precrime-agents/card-21.webp"];
let index=0;const image=document.querySelector("#shot"),counter=document.querySelector("#counter");
function show(next){index=(next+shots.length)%shots.length;image.src=shots[index];image.alt=`논문 해설 카드 ${index+1}/${shots.length}`;counter.textContent=`${index+1} / ${shots.length}`;history.replaceState(null,"",`#${index+1}`)}
document.querySelector("#prev").onclick=()=>show(index-1);document.querySelector("#next").onclick=()=>show(index+1);
addEventListener("keydown",event=>{if(event.key==="ArrowLeft")show(index-1);if(event.key==="ArrowRight"||event.key===" ")show(index+1)});
let start=0;addEventListener("touchstart",event=>start=event.touches[0].clientX,{passive:true});addEventListener("touchend",event=>{const distance=event.changedTouches[0].clientX-start;if(Math.abs(distance)>45)show(index+(distance<0?1:-1))},{passive:true});
const initial=Number(location.hash.slice(1));show(Number.isInteger(initial)&&initial>0&&initial<=shots.length?initial-1:0);
</script>
</body>
</html>
